<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emergent — Artist</title>
  <meta name="description" content="Artist profile on Emergent: bio, genre, and available tracks with direct Spotify listening." />
  <meta name="theme-color" content="#070a12" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header class="header">
    <div class="container header__inner">
      <a class="brand" href="./index.html">
        <div class="logo" aria-hidden="true">E</div>
        <div>
          <div class="brand__name">Emergent</div>
          <div class="brand__tag" data-i18n="brand_tag">Discover the next sound.</div>
        </div>
      </a>

      <button id="navToggle" class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="primaryNav">☰</button>

      <nav class="nav" id="primaryNav" aria-label="Primary">
        <a class="chip" href="./index.html" data-i18n="nav_discover">Discover</a>
        <a class="chip chip--active" href="./artists.html" data-i18n="nav_artists">Artists</a>
        <a class="chip" href="./index.html?tab=new#catalog" data-i18n="nav_new">New Releases</a>
        <a class="chip" href="./index.html?tab=favorites" data-i18n="nav_favorites">Favorites</a>
        <a class="chip" href="./submit.html" data-i18n="nav_submit">Submit Music</a>
      </nav>

      <div class="header__actions">
        <select id="langSelect" class="select" aria-label="Language">
          <option value="en">EN</option>
          <option value="fr">FR</option>
          <option value="bg">BG</option>
        </select>
        <button class="icon-btn" data-theme-btn title="Toggle theme" aria-label="Toggle theme">🌙</button>
      </div>
    </div>
  </header>

  <main class="container main">
    <a class="btn btn--ghost btn--sm" href="./artists.html" data-i18n="back" style="margin-bottom:20px; display:inline-flex;">← Back</a>

    <div id="artistContent"></div>

    <section class="section" id="tracksSection" hidden>
      <div class="section__head">
        <h2 data-i18n="artist_tracks_title">Available tracks</h2>
      </div>
      <div id="trackList"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <div class="footer__brand">
        <div class="logo" aria-hidden="true">E</div>
        <div>
          <div class="brand__name">Emergent</div>
          <div class="muted" data-i18n="footer_tag">Discover emerging talent.</div>
        </div>
      </div>
      <nav class="footer__nav" aria-label="Footer">
        <a href="./index.html" data-i18n="nav_discover">Discover</a>
        <a href="./artists.html" data-i18n="nav_artists">Artists</a>
        <a href="./submit.html" data-i18n="nav_submit">Submit Music</a>
      </nav>
    </div>
    <div class="container footer__meta">
      <div data-i18n="footer_student">Student project — Varna University of Management, 2026</div>
      <div data-i18n="footer_erasmus">Designed and developed as part of an Erasmus academic project.</div>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./data.js"></script>
  <script src="./shared.js"></script>
  <script src="./artist.js"></script>
</body>
</html>
